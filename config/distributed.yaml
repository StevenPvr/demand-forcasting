project:
  repo_path: /Users/steven/Programmation/research_praedixa
  python_bin: .venv/bin/python
  dask_bin: .venv/bin/dask

scheduler:
  host: MacBook-Pro-de-Steven.local
  bind_host: 0.0.0.0
  port: 8786
  dashboard_port: 8787

postgres:
  host: MacBook-Pro-de-Steven.local
  bind_host: 0.0.0.0
  port: 54329
  database: praedixa_optuna
  user: praedixa_optuna
  password: praedixa_optuna_local_dev
  data_dir: artifacts/postgres/data
  log_path: logs/distributed/postgres.log
  air_allow_cidr: 10.188.88.36/32

workers:
  pro:
    worker_count: 3
    dask_threads_per_worker: 1
    xgboost_threads_per_task: 2
    memory_limit: 6GiB
    local_directory: artifacts/dask/pro
  air:
    ssh_host: steven@Macbook-Air-de-Steven.local
    fallback_host: steven@10.188.88.36
    worker_count: 2
    dask_threads_per_worker: 1
    xgboost_threads_per_task: 2
    memory_limit: 5GiB
    local_directory: artifacts/dask/air

runtime:
  logs_dir: logs/distributed
  pid_dir: artifacts/run/distributed
  sync_mode: rsync
  sync_excludes:
    - .git/
    - .venv/
    - __pycache__/
    - .pytest_cache/
    - .mypy_cache/
    - logs/
    - artifacts/run/
  sync_includes:
    - config/
    - data/
    - warehouse/
    - bakery_sales/data/
    - scripts/
    - src/
    - tests/
    - pyproject.toml
    - Makefile
    - README.md

pipelines:
  optimisation:
    train_sample_fraction: 0.2
    tuning_sample_fraction: 0.2
    n_folds: 5
    tuning_trials: 50
    optuna_parallel_tasks: 5
    max_parallel_fold_workers: 1
  feature_selection:
    candidate_batch_size: 12
    n_folds: 5
    tuning_trials: 50
  evaluation:
    batch_dates_per_task: 14
  inference:
    batch_rows: 100000
