project:
  repo_path: /Users/steven/Programmation/research_praedixa
  python_bin: .venv/bin/python
  dask_bin: .venv/bin/dask

scheduler:
  host: 172.20.10.14
  bind_host: 0.0.0.0
  port: 8786
  dashboard_port: 8787

postgres:
  host: 172.20.10.14
  bind_host: 0.0.0.0
  port: 54329
  database: praedixa_optuna
  user: praedixa_optuna
  password: praedixa_optuna_local_dev
  data_dir: artifacts/postgres/data
  log_path: logs/distributed/postgres.log
  allow_cidrs:
    - 172.20.10.14/32
    - 172.20.10.2/32

workers:
  pro:
    worker_count: 1
    dask_threads_per_worker: 11
    xgboost_threads_per_task: 1
    memory_limit: 66GiB
    local_directory: artifacts/dask/pro
  air:
    ssh_host: steven@172.20.10.2
    fallback_host: steven@Macbook-Air-de-Steven.local
    worker_count: 1
    dask_threads_per_worker: 8
    xgboost_threads_per_task: 1
    memory_limit: 40GiB
    local_directory: artifacts/dask/air

runtime:
  logs_dir: logs/distributed
  pid_dir: artifacts/run/distributed
  sync_mode: rsync
  sync_excludes:
    - .git/
    - .venv/
    - __pycache__/
    - .pytest_cache/
    - .mypy_cache/
    - logs/
    - artifacts/
    - artifacts/run/
    - data/
    - bakery_sales/
  sync_includes:
    - config/
    - warehouse/
    - praedixa-ecc/
    - scripts/
    - src/
    - tests/
    - pyproject.toml
    - Makefile
    - README.md

pipelines:
  optimisation:
    train_sample_fraction: 0.2
    tuning_sample_fraction: 0.2
    n_folds: 5
    tuning_trials: 50
    optuna_parallel_tasks: 19
    max_parallel_fold_workers: 1
  feature_selection:
    candidate_batch_size: 12
    n_folds: 5
    tuning_trials: 50
  evaluation:
    batch_dates_per_task: 14
  inference:
    batch_rows: 100000
