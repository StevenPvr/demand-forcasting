# Restaurant simulator — relational schema (tables A–T + extensions).
# Convention: amounts decimal(10,2); vat_rate decimal(5,4); levels 0–3 unless noted.
# schema_version must match schema_version.SCHEMA_VERSION when materialized.
schema_version: "1.0.0"
conventions:
  id_string: "Human-readable or UUID, stable within a simulation_id run unless export corruption applies."
  money_eur: "decimal(10,2) — TTC or HT per column name."
  timestamptz: "ISO-8601 with timezone; DST transitions must be scenario-configurable."
  flag: "boolean; in dirty export may appear 0/1 smallint."
  level_0_3: "tinyint 0–3 ordinal (e.g. dependency intensity)."
  level_0_1: "float 0.0–1.0 for probabilities or shares."

enums:
