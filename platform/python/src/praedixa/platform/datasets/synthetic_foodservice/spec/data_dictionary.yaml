  impact_direction:
    - positive
    - negative
    - mixed

tables:
  locations:
    description: "Shared geography for weather/events when multiple sites sit in the same metro area."
    columns:
      location_id:
        type: string
        pk: true
        nullable: false
      country:
        type: string
        nullable: false
      region:
        type: string
        nullable: true
      city_name:
        type: string
        nullable: true
      geo_lat:
        type: float
        nullable: true
      geo_lon:
        type: float
        nullable: true
      timezone:
        type: string
        nullable: false
    foreign_keys: []

  sites:
    description: "A — Establishments."
    columns:
      site_id:
        type: string
        pk: true
        nullable: false
      location_id:
        type: string
        nullable: false
        fk: locations.location_id
      site_name:
        type: string
        nullable: false
      business_type:
        type: enum.business_type
        nullable: false
      city_type:
        type: enum.city_type
        nullable: false
      location_type:
        type: enum.location_type
        nullable: false
      positioning:
        type: string
        nullable: false
        notes: "Comma-separated or JSON list of enum.positioning values for mixed modes."
      structure:
        type: enum.structure
        nullable: false
      franchise_flag:
        type: boolean
        nullable: false
      network_id:
        type: string
        nullable: true
      opening_date:
        type: date
        nullable: false
      closing_date:
        type: date
        nullable: true
      surface_area_m2:
        type: float
        nullable: true
      seating_capacity:
        type: int
        nullable: true
      kitchen_capacity_level:
        type: int
        nullable: false
        notes: "Ordinal 1–5 kitchen throughput tier."
      average_daily_traffic_level:
        type: int
        nullable: false
        notes: "Ordinal footfall / demand driver 0–3."
      delivery_available_flag:
        type: boolean
        nullable: false
      takeaway_available_flag:
        type: boolean
        nullable: false
      terrace_flag:
        type: boolean
        nullable: false
      tourism_dependency_level:
        type: int
        nullable: false
        notes: "0–3"
      office_dependency_level:
        type: int
        nullable: false
      student_dependency_level:
        type: int
        nullable: false
      weather_sensitivity_level:
        type: int
        nullable: false
      event_sensitivity_level:
        type: int
        nullable: false
      data_quality_level:
        type: string
        nullable: false
        notes: "Maps to export corruption profile: high, medium, medium_low, low."
    foreign_keys:
      - column: location_id
        references: locations.location_id

  delivery_zones:
    description: "Optional delivery polygons / radii for dark kitchen and platform routing."
    columns:
      delivery_zone_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
        fk: sites.site_id
      zone_label:
        type: string
        nullable: true
      center_lat:
        type: float
        nullable: true
      center_lon:
        type: float
        nullable: true
      radius_km:
        type: float
        nullable: true
      notes:
        type: string
        nullable: true
    foreign_keys:
      - column: site_id
        references: sites.site_id

  pos_versions:
    description: "POS software version windows; drives mapping degradation and export quirks."
    columns:
      pos_version_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
        fk: sites.site_id
      pos_system_name:
        type: string
        nullable: false
      valid_from:
        type: timestamptz
        nullable: false
      valid_to:
        type: timestamptz
        nullable: true
      mapping_quality_score:
        type: float
        nullable: false
        notes: "0–1 lower means more ID churn and category drift in export layer."
    foreign_keys:
      - column: site_id
        references: sites.site_id

  product_id_mappings:
    description: "SKU lineage for renamed, split, merged products (POS instability)."
    columns:
      mapping_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: true
        fk: sites.site_id
      network_id:
        type: string
        nullable: true
      old_product_id:
        type: string
        nullable: false
      new_product_id:
        type: string
        nullable: false
      effective_from:
        type: timestamptz
        nullable: false
      effective_to:
        type: timestamptz
        nullable: true
      mapping_reason:
        type: string
        nullable: true
    foreign_keys:
      - column: site_id
        references: sites.site_id

  product_categories:
    description: "C — Product category hierarchy."
    columns:
      category_id:
        type: string
        pk: true
        nullable: false
      category_name:
        type: string
        nullable: false
      parent_category_id:
        type: string
        nullable: true
        fk: product_categories.category_id
      typical_margin_level:
        type: int
        nullable: true
        notes: "0–3"
      typical_shelf_life:
        type: string
        nullable: true
        notes: "e.g. short_perishable, daily, ambient"
      weather_sensitivity:
        type: string
        nullable: true
      seasonality_type:
        type: string
        nullable: true
      typical_sales_pattern:
        type: string
        nullable: true
    foreign_keys: []

  products:
    description: "B — Sellable items."
    columns:
      product_id:
        type: string
        pk: true
        nullable: false
      product_name:
        type: string
        nullable: false
      category:
        type: string
        nullable: false
        fk: product_categories.category_id
      sub_category:
        type: string
        nullable: true
      product_type:
        type: string
        nullable: false
      site_id:
        type: string
        nullable: true
        fk: sites.site_id
      network_product_id:
        type: string
        nullable: true
      launch_date:
        type: date
        nullable: false
      end_date:
        type: date
        nullable: true
      active_flag:
        type: boolean
        nullable: false
      seasonal_flag:
        type: boolean
        nullable: false
      permanent_flag:
        type: boolean
        nullable: false
      rare_product_flag:
        type: boolean
        nullable: false
      best_seller_flag:
        type: boolean
        nullable: false
      premium_flag:
        type: boolean
        nullable: false
      preparation_time_seconds:
        type: int
        nullable: true
      shelf_life_hours:
        type: float
        nullable: true
      cold_product_flag:
        type: boolean
        nullable: false
      hot_product_flag:
        type: boolean
        nullable: false
      delivery_compatible_flag:
        type: boolean
        nullable: false
      substitution_group_id:
        type: string
        nullable: true
      complement_group_id:
        type: string
        nullable: true
      lifecycle_state:
        type: string
        nullable: true
        notes: "new | ramp_up | stable | best_seller | decline | retired | replaced | renamed | merged"
    foreign_keys:
      - column: site_id
        references: sites.site_id
      - column: category
        references: product_categories.category_id

  reservations:
    description: "Optional table for traditional restaurant covers and no-shows."
    columns:
      reservation_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
