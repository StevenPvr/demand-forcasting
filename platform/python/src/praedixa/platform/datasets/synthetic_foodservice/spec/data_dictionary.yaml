      - column: site_id
        references: sites.site_id

  prices:
    description: "D — SCD Type 2 price history."
    columns:
      price_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
        fk: sites.site_id
      product_id:
        type: string
        nullable: false
        fk: products.product_id
      channel:
        type: string
        nullable: true
        notes: "null = default list price for all channels if simulator uses single list."
      start_datetime:
        type: timestamptz
        nullable: false
      end_datetime:
        type: timestamptz
        nullable: true
      price_ttc:
        type: money_eur
        nullable: false
      price_ht:
        type: money_eur
        nullable: false
      vat_rate:
        type: decimal
        nullable: false
      price_change_reason:
        type: string
        nullable: true
      rounded_price_flag:
        type: boolean
        nullable: false
    foreign_keys:
      - column: site_id
        references: sites.site_id
      - column: product_id
        references: products.product_id

  promotions:
    description: "E — Commercial offers."
    columns:
      promotion_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
        fk: sites.site_id
      product_id:
        type: string
        nullable: true
        fk: products.product_id
      promotion_type:
        type: enum.promotion_type
        nullable: false
      start_datetime:
        type: timestamptz
        nullable: false
      end_datetime:
        type: timestamptz
        nullable: false
      discount_rate:
        type: float
        nullable: true
      discount_amount:
        type: money_eur
        nullable: true
      bundle_flag:
        type: boolean
        nullable: false
      menu_flag:
        type: boolean
        nullable: false
      channel:
        type: string
        nullable: true
      promotion_intensity:
        type: float
        nullable: true
        notes: "0–1 lifts latent demand multiplier."
      planned_flag:
        type: boolean
        nullable: false
      actually_applied_flag:
        type: boolean
        nullable: false
    foreign_keys:
      - column: site_id
        references: sites.site_id
      - column: product_id
        references: products.product_id

  opening_hours:
    description: "F — Theoretical opening by day and service."
    columns:
      opening_hours_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
        fk: sites.site_id
      day_of_week:
        type: int
        nullable: false
        notes: "0=Monday .. 6=Sunday"
      opening_time:
        type: string
        nullable: false
        notes: "HH:MM local"
      closing_time:
        type: string
        nullable: false
      service_type:
        type: string
        nullable: false
        notes: "breakfast | lunch | dinner | continuous | cafe | bakery_morning"
      valid_from:
        type: date
        nullable: false
      valid_to:
        type: date
        nullable: true
    foreign_keys:
      - column: site_id
        references: sites.site_id

  closures:
    description: "G — Exceptional closures."
    columns:
      closure_id:
        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
        fk: sites.site_id
      start_datetime:
        type: timestamptz
        nullable: false
      end_datetime:
        type: timestamptz
        nullable: false
      closure_reason:
        type: enum.closure_reason
        nullable: false
      planned_flag:
        type: boolean
        nullable: false
      visible_in_source_data_flag:
        type: boolean
        nullable: false
    foreign_keys:
      - column: site_id
        references: sites.site_id

  sales_tickets:
