        references: products.product_id
      - column: promotion_id
        references: promotions.promotion_id

  weather:
    description: "J — Local weather series."
    columns:
      weather_id:
        type: string
        pk: true
        nullable: false
      location_id:
        type: string
        nullable: false
        fk: locations.location_id
      site_id:
        type: string
        nullable: true
        fk: sites.site_id
        notes: "Optional denormalized copy for single-site exports."
      datetime:
        type: timestamptz
        nullable: false
      date:
        type: date
        nullable: false
      temperature:
        type: float
        nullable: true
      apparent_temperature:
        type: float
        nullable: true
      rain_mm:
        type: float
        nullable: true
      snow_flag:
        type: boolean
        nullable: false
      wind_speed:
        type: float
        nullable: true
      humidity:
        type: float
        nullable: true
      sunshine_duration:
        type: float
        nullable: true
      weather_condition:
        type: string
        nullable: true
      heatwave_flag:
        type: boolean
        nullable: false
      cold_wave_flag:
        type: boolean
        nullable: false
      storm_flag:
        type: boolean
        nullable: false
    foreign_keys:
      - column: location_id
        references: locations.location_id
      - column: site_id
        references: sites.site_id

  local_events:
    description: "K — External shocks and local demand drivers."
    columns:
      event_id:
        type: string
        pk: true
        nullable: false
      location_id:
        type: string
        nullable: false
        fk: locations.location_id
      site_id:
        type: string
        nullable: true
        fk: sites.site_id
      event_name:
        type: string
        nullable: false
      event_type:
        type: enum.local_event_type
        nullable: false
      start_datetime:
        type: timestamptz
        nullable: false
      end_datetime:
        type: timestamptz
        nullable: false
