    - franchise_multi
    - integrated_chain
    - dark_kitchen_multi_brand
    - family_run
  positioning:
    - budget
    - mid
    - premium
    - single_product_focus
    - short_menu
    - wide_catalog
    - dine_in
    - takeaway
    - delivery
    - mixed
    - lunch_only
    - lunch_dinner
    - late_night
    - open_7d
    - partial_week
  sales_channel:
