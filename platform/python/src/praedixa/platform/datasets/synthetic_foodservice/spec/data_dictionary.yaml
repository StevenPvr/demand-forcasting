    - takeaway
    - delivery_own
    - uber_eats
    - deliveroo
    - just_eat
    - other_platform
  promotion_type:
    - percent_off
    - fixed_off
    - bxgy
    - bundle
    - menu
    - happy_hour
    - platform_subsidy
    - waste_reduction
