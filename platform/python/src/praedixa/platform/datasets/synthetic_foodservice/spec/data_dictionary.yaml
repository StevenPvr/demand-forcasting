      channel:
        type: enum.sales_channel
        nullable: false
      order_type:
        type: string
        nullable: true
      delivery_platform:
        type: string
        nullable: true
      table_id:
        type: string
        nullable: true
      customer_type:
        type: string
        nullable: true
      total_amount_ttc:
        type: money_eur
        nullable: false
      total_amount_ht:
        type: money_eur
        nullable: false
      total_discount:
        type: money_eur
        nullable: false
      payment_method:
        type: string
        nullable: true
      cancelled_flag:
        type: boolean
        nullable: false
      refunded_flag:
        type: boolean
        nullable: false
      correction_flag:
        type: boolean
        nullable: false
      pos_system_id:
        type: string
        nullable: true
      cashier_id:
        type: string
        nullable: true
