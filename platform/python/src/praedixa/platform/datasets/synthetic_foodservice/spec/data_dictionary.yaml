        type: string
        pk: true
        nullable: false
      site_id:
        type: string
        nullable: false
        fk: sites.site_id
      datetime:
        type: timestamptz
        nullable: false
      date:
        type: date
        nullable: false
      time:
        type: string
        nullable: false
        notes: "HH:MM:SS local snapshot; may disagree with datetime in dirty export."
      time_bucket_15min:
        type: string
        nullable: false
