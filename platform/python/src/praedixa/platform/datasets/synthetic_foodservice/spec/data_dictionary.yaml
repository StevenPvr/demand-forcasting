    foreign_keys:
      - column: site_id
        references: sites.site_id

  sales_lines:
    description: "I — Ticket lines."
    columns:
      sales_line_id:
        type: string
        pk: true
        nullable: false
      ticket_id:
        type: string
        nullable: false
