version: 2

models:
  - name: silver_daily_product_demand
    columns:
      - name: dataset_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "freshretail",
                    "freshretail_lt",
                    "bakery",
                    "first_party_daily",
                    "m5_forecasting_accuracy",
                    "uci_online_retail_ii",
                    "uci_online_retail",
                    "restaurant_sales_report",
                    "perishable_goods_management",
                    "synthetic_foodservice_qsr",
                    "synthetic_foodservice_bakery",
                    "synthetic_foodservice_restaurant",
                  ]
      - name: dt
        tests:
          - not_null
      - name: location_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: series_id
        tests:
          - not_null
      - name: observed_demand_qty
        tests:
          - not_null
      - name: target_semantics
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["observed_sales", "latent_demand_estimated"]
      - name: censor_flag
        tests:
          - not_null
      - name: target_source
        tests:
          - not_null
      - name: label_quality_score
        tests:
          - not_null
      - name: usable_for_training_flag
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dataset_source
              - dt
              - location_id
              - product_id
