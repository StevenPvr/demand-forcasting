version: 2

models:
  - name: silver_daily_product_demand
    columns:
      - name: dataset_source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    "freshretail",
                    "freshretail_lt",
                    "uci_online_retail",
                    "uci_online_retail_ii",
                    "mendeley_ecommerce",
                    "mendeley_pharmacy_id",
                    "mendeley_bangladesh_retail",
                    "bakery",
                  ]
      - name: dt
        tests:
          - not_null
      - name: location_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: series_id
        tests:
          - not_null
      - name: observed_demand_qty
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - dataset_source
              - dt
              - location_id
              - product_id
